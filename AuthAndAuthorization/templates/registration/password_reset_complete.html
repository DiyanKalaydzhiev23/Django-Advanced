<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Password Reset Complete</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #222;
            margin: 0;
        }

        header {
            background: #2d3e50;
            color: #fff;
            padding: 1rem 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        main h2 {
            margin-top: 0;
        }

        .success {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            background: #e6f4ea;
            color: #1e5631;
            margin-bottom: 1.5rem;
        }

        .button {
            display: inline-block;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            background: #2d3e50;
            color: #fff;
            text-decoration: none;
        }

        .button:hover {
            background: #3c5268;
        }
    </style>
</head>
<body>
<header>
    <h1>Notes</h1>
</header>

<main>
    <h2>Password reset complete</h2>

    <p class="success">Your password has been set. You can now log in with your new password.</p>

    <a class="button" href="{% url 'cbv-login' %}">Log in</a>
</main>
</body>
</html>
