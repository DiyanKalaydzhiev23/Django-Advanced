<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Set New Password</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #222;
            margin: 0;
        }

        header {
            background: #2d3e50;
            color: #fff;
            padding: 1rem 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        main h2 {
            margin-top: 0;
        }

        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 1rem;
        }

        .errorlist li,
        .invalid {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            background: #fdecea;
            color: #8a1c1c;
        }

        .invalid {
            margin-bottom: 1.5rem;
        }

        .helptext {
            display: block;
            font-size: 0.85rem;
            color: #666;
            margin: -0.5rem 0 1rem;
        }

        .helptext ul {
            padding-left: 1.2rem;
            margin: 0;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #2d3e50;
        }

        button,
        .button {
            display: block;
            width: 100%;
            box-sizing: border-box;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #2d3e50;
            color: #fff;
            font-size: 1rem;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
        }

        button:hover,
        .button:hover {
            background: #3c5268;
        }
    </style>
</head>
<body>
<header>
    <h1>Notes</h1>
</header>

<main>
    {% if validlink %}
        <h2>Set a new password</h2>

        <form method="post">
            {% csrf_token %}
            {{ form }}
            <button type="submit">Change password</button>
        </form>
    {% else %}
        <h2>Invalid link</h2>

        <p class="invalid">This password reset link is invalid, possibly because it has already been used or has expired.</p>

        <a class="button" href="{% url 'password_reset' %}">Request a new link</a>
    {% endif %}
</main>
</body>
</html>
