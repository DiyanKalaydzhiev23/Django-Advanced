<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Login</title>
    <style>
        body {
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f4f5f7;
            color: #222;
            margin: 0;
        }

        header {
            background: #2d3e50;
            color: #fff;
            padding: 1rem 2rem;
        }

        header h1 {
            margin: 0;
            font-size: 1.4rem;
        }

        main {
            max-width: 400px;
            margin: 3rem auto;
            padding: 2rem;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        main h2 {
            margin-top: 0;
        }

        .messages {
            list-style: none;
            padding: 0;
            margin: 0 0 1.5rem;
        }

        .messages li {
            padding: 0.75rem 1rem;
            border-radius: 6px;
            background: #e8f0fe;
            color: #1a3d7c;
        }

        .messages li.error {
            background: #fdecea;
            color: #8a1c1c;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 0.6rem 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: #2d3e50;
        }

        button {
            width: 100%;
            padding: 0.7rem;
            border: none;
            border-radius: 6px;
            background: #2d3e50;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background: #3c5268;
        }
    </style>
</head>
<body>
<header>
    <h1>Notes</h1>
</header>

<main>
    <h2>Log in</h2>

    {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li class="{{ message.tags }}">{{ message }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form }}
        <button type="submit">Log in</button>
    </form>
</main>
</body>
</html>
